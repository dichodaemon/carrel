services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      EXEC: 1
      POST: 1
      IMAGES: 1
      BUILD: 1
    networks:
      - internal
    restart: unless-stopped

  carrel:
    build: .
    container_name: carrel
    user: "${UID}:${GID}"
    volumes:
      - ${WORKSPACE}:/workspace
      - ~/.ssh:/home/dev/.ssh:ro
      - ~/.gitconfig:/home/dev/.gitconfig:ro
      - ~/.config/gh:/home/dev/.config/gh
      - ~/.config/doc-fetch:/home/dev/.config/doc-fetch:ro
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      HOME: /home/dev
      HINDSIGHT_API_URL: http://hindsight:8888
      DOCKER_STACK_DIR: /workspace/core-stack
    networks:
      - internal
    restart: unless-stopped
    command: ["sleep", "infinity"]
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: hindsight
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    ports:
      - "${HINDSIGHT_PORT:-8800}:8888"
      - "${HINDSIGHT_CP_PORT:-9999}:9999"
    environment:
      HINDSIGHT_API_LLM_PROVIDER: ollama
      HINDSIGHT_API_LLM_BASE_URL: http://ollama:11434/v1
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_OLLAMA_MODEL:-gemma4:12b}
      HINDSIGHT_API_WORKER_ID: hindsight-carrel
    networks:
      - internal
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    networks:
      - internal
    restart: unless-stopped
    # GPU passthrough — uncommented by bin/launch when nvidia-smi is available
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]


networks:
  internal:
    driver: bridge

volumes:
  hindsight-data:
  ollama-data:
